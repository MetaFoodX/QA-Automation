[project]
name = "QA-Automation"
version = "0.1.0"
description = "End-to-end test automation for Tablet and Dashboard"
requires-python = ">=3.11"

dependencies = [
    "playwright==1.63.0",
    "pytest>=8.2.0",
    # Pinned exactly, not >=: 0.10+ injects a "[chromium]"-style parametrize
    # suffix onto any test using a fixture literally named page/context/
    # browser/etc, matched by name alone -- it doesn't know or care that
    # dashboard/fixtures/browser_fixtures.py's own same-named fixtures never
    # touch its browser_name fixture. 0.8.0 predates that behavior change.
    "pytest-playwright==0.8.0",
    "pytest-xdist>=3.6.0",
    "pytest-html>=4.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "allure-pytest>=2.13.0",
    "openpyxl>=3.1.0",
    "Appium-Python-Client>=3.1.0",
    "boto3>=1.34.0",
    "pdfplumber>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "dashboard", "tablet", "iosapp"]