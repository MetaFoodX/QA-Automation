[project]
name = "QA-Automation"
version = "0.1.0"
description = "End-to-end test automation for Tablet and Dashboard"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.45.0",
    "pytest>=8.2.0",
    "pytest-playwright>=0.5.0",
    "pytest-xdist>=3.6.0",
    "pytest-html>=4.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "allure-pytest>=2.13.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "pages", "locators", "data", "utils", "fixtures"]