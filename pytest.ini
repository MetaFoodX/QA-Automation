[pytest]
testpaths = dashboard/tests tablet/tests iosapp/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --junitxml=reports/junit.xml
    --alluredir=allure-results
    --clean-alluredir

log_level = INFO
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

markers =
    smoke: critical-path tests, run on every commit
    regression: full coverage, run nightly or pre-release
    testcase: excel report metadata (component, type, description, steps)
    slow: tests that take > 30 seconds
    flaky: known unstable, investigate before next release
    wip: work-in-progress, skip by default